services:

  postgres:
    image: postgres:16
    container_name: nivora-postgres

    command: postgres -c password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${DATABASE_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    container_name: nivora-redis

    ports:
      - "${REDIS_PORT}:6379"


volumes:
  postgres_data: